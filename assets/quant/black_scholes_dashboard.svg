<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <!-- Background App Shell (Streamlit Dark Theme) -->
  <rect width="800" height="450" fill="#0e1117" rx="8"/>
  <rect width="800" height="450" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="8"/>

  <!-- Top Navigation Bar -->
  <rect width="800" height="40" fill="#161b22" rx="8"/>
  <circle cx="20" cy="20" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="34" cy="20" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="48" cy="20" r="4" fill="#10b981" opacity="0.8"/>
  <text x="70" y="24" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">optionprofitmodel.streamlit.app</text>
  <rect x="660" y="11" width="120" height="18" fill="#21262d" rx="4"/>
  <text x="670" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Pricing &amp; Payoff</text>

  <!-- Left Sidebar Controls -->
  <rect x="0" y="40" width="190" height="410" fill="#161b22"/>
  <line x1="190" y1="40" x2="190" y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="20" y="70" fill="#f0f6fc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Strategy Builder</text>

  <text x="20" y="98" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Position Type</text>
  <rect x="20" y="106" width="70" height="24" fill="#38bdf8" rx="4"/>
  <text x="32" y="122" fill="#090d16" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Long Call</text>
  <rect x="95" y="106" width="75" height="24" fill="#0d1117" stroke="rgba(255,255,255,0.1)" rx="4"/>
  <text x="110" y="122" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Long Put</text>

  <text x="20" y="152" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Strike Price (K)</text>
  <rect x="20" y="160" width="150" height="24" fill="#0d1117" stroke="rgba(255,255,255,0.1)" rx="4"/>
  <text x="30" y="176" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">$105.00</text>

  <text x="20" y="206" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Call Premium (C₀)</text>
  <rect x="20" y="214" width="150" height="24" fill="#0d1117" stroke="rgba(255,255,255,0.1)" rx="4"/>
  <text x="30" y="230" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">$4.20</text>

  <text x="20" y="260" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Implied Volatility (σ)</text>
  <line x1="20" y1="276" x2="170" y2="276" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="276" x2="85" y2="276" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85" cy="276" r="5" fill="#38bdf8"/>
  <text x="145" y="262" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">22.5%</text>

  <text x="20" y="310" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Risk-Free Rate (r)</text>
  <line x1="20" y1="326" x2="170" y2="326" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="326" x2="75" y2="326" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="75" cy="326" r="5" fill="#38bdf8"/>
  <text x="145" y="312" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">4.50%</text>

  <!-- Main Content Area -->
  <g transform="translate(205, 55)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="135" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="12" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Break-Even Price</text>
    <text x="12" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">$109.20</text>
    <text x="96" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">K + C</text>

    <!-- KPI 2 -->
    <rect x="145" y="0" width="135" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="157" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Max Risk (Premium)</text>
    <text x="157" y="40" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">-$420</text>
    <text x="220" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">1 Contract</text>

    <!-- KPI 3 -->
    <rect x="290" y="0" width="140" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="302" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Max Profit</text>
    <text x="302" y="40" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Unlimited</text>
    <text x="390" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">S_T → ∞</text>

    <!-- KPI 4 -->
    <rect x="440" y="0" width="135" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="452" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Est. Win Prob (PoP)</text>
    <text x="452" y="40" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">42.8%</text>
    <text x="515" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">N(d₂)</text>
  </g>

  <!-- Main Payoff Curve Chart -->
  <g transform="translate(205, 125)">
    <rect x="0" y="0" width="575" height="230" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="16" y="24" fill="#f0f6fc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Simulated Net Profit/Loss Profile vs. Underlying Price at Expiration</text>

    <!-- Legend -->
    <line x1="365" y1="20" x2="390" y2="20" stroke="#10b981" stroke-width="2.5"/>
    <text x="397" y="24" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="9">Expiration Payoff</text>
    <line x1="485" y1="20" x2="510" y2="20" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text x="517" y="24" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">Current (t &lt; T)</text>

    <!-- Zero P&L Axis -->
    <line x1="40" y1="130" x2="555" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="12" y="134" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">$0</text>

    <!-- Grid lines -->
    <line x1="40" y1="70" x2="555" y2="70" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="0" y="74" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">+$10</text>
    <line x1="40" y1="190" x2="555" y2="190" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="0" y="194" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">-$10</text>

    <!-- Shaded Max Loss Area -->
    <rect x="40" y="130" width="230" height="42" fill="rgba(239,68,68,0.08)"/>

    <!-- Expiration Hockey-Stick Payoff Line -->
    <path d="M 40 172 L 270 172 L 480 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pre-expiration Black-Scholes Curve -->
    <path d="M 40 170 C 130 170, 200 165, 270 148 C 340 128, 410 75, 480 40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Strike Price Line K=105 -->
    <line x1="270" y1="40" x2="270" y2="200" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="250" y="215" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="9">K=$105</text>

    <!-- Break-Even Price S*=109.20 -->
    <circle cx="330" cy="130" r="4.5" fill="#38bdf8"/>
    <line x1="330" y1="50" x2="330" y2="200" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="310" y="215" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">B/E $109.20</text>

    <!-- Underlying Price Ticks -->
    <text x="50" y="215" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">$85</text>
    <text x="160" y="215" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">$95</text>
    <text x="440" y="215" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">$120</text>
    <text x="520" y="215" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">$130</text>
  </g>

  <!-- Bottom Formula Banner -->
  <g transform="translate(205, 370)">
    <rect x="0" y="0" width="575" height="60" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="16" y="22" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">
      <tspan font-weight="600" fill="#38bdf8">Analytical Pricing:</tspan> C(S,t) = S₀ N(d₁) - K e⁻ʳᵀ N(d₂) where d₁ = (ln(S₀/K) + (r + σ²/2)T) / (σ√T)
    </text>
    <text x="16" y="44" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">
      Simulates non-linear volatility adjustments, dynamic time decay schedules, and contract payoff thresholds.
    </text>
  </g>
</svg>
