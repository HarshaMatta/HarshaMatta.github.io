<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <!-- Background App Shell (Streamlit Dark Theme) -->
  <rect width="800" height="450" fill="#0e1117" rx="8"/>
  <rect width="800" height="450" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="8"/>

  <!-- Top Navigation Bar -->
  <rect width="800" height="40" fill="#161b22" rx="8"/>
  <circle cx="20" cy="20" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="34" cy="20" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="48" cy="20" r="4" fill="#10b981" opacity="0.8"/>
  <text x="70" y="24" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">greeksvisualizer.streamlit.app</text>
  <rect x="660" y="11" width="120" height="18" fill="#21262d" rx="4"/>
  <text x="674" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">SciPy / Analytical</text>

  <!-- Left Sidebar Controls -->
  <rect x="0" y="40" width="190" height="410" fill="#161b22"/>
  <line x1="190" y1="40" x2="190" y2="450" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <text x="20" y="70" fill="#f0f6fc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Contract &amp; Market</text>

  <text x="20" y="98" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Spot Price (S₀)</text>
  <line x1="20" y1="114" x2="170" y2="114" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="114" x2="95" y2="114" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="95" cy="114" r="5" fill="#38bdf8"/>
  <text x="140" y="100" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">$100.00</text>

  <text x="20" y="148" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Strike Price (K)</text>
  <line x1="20" y1="164" x2="170" y2="164" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="164" x2="95" y2="164" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="95" cy="164" r="5" fill="#38bdf8"/>
  <text x="140" y="150" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">$100.00</text>

  <text x="20" y="198" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Implied Vol (σ)</text>
  <line x1="20" y1="214" x2="170" y2="214" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="214" x2="70" y2="214" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="70" cy="214" r="5" fill="#38bdf8"/>
  <text x="145" y="200" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">20.0%</text>

  <text x="20" y="248" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Risk-Free Rate (r)</text>
  <line x1="20" y1="264" x2="170" y2="264" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="264" x2="80" y2="264" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="80" cy="264" r="5" fill="#38bdf8"/>
  <text x="145" y="250" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">4.50%</text>

  <text x="20" y="298" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Days to Expiry (T)</text>
  <line x1="20" y1="314" x2="170" y2="314" stroke="#30363d" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="314" x2="115" y2="314" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="115" cy="314" r="5" fill="#38bdf8"/>
  <text x="145" y="300" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="10">45 Days</text>

  <!-- Main Content Area -->
  <!-- Top Metric Cards -->
  <g transform="translate(205, 55)">
    <rect x="0" y="0" width="135" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="12" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Delta (Δ)</text>
    <text x="12" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">+0.542</text>
    <text x="88" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">∂C/∂S</text>

    <rect x="145" y="0" width="135" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="157" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Gamma (Γ)</text>
    <text x="157" y="40" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">+0.058</text>
    <text x="235" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">∂²C/∂S²</text>

    <rect x="290" y="0" width="140" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="302" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Theta (Θ)</text>
    <text x="302" y="40" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">-0.038</text>
    <text x="385" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">$/day</text>

    <rect x="440" y="0" width="135" height="55" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="452" y="18" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">Vega (V)</text>
    <text x="452" y="40" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">+0.141</text>
    <text x="532" y="40" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10">$/1%σ</text>
  </g>

  <!-- Plot 1: Delta & Gamma Profiles -->
  <g transform="translate(205, 125)">
    <rect x="0" y="0" width="280" height="195" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="14" y="22" fill="#f0f6fc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Delta Profile (Δ vs. Spot Price)</text>
    <line x1="25" y1="50" x2="260" y2="50" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="25" y1="105" x2="260" y2="105" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="25" y1="160" x2="260" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Sigmoid Delta Curve -->
    <path d="M 25 158 C 75 158, 120 152, 142 105 C 165 58, 210 52, 260 52" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- ATM Marker -->
    <line x1="142" y1="35" x2="142" y2="160" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="142" cy="105" r="4" fill="#f59e0b"/>
    <text x="148" y="100" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">ATM (Δ=0.54)</text>

    <text x="10" y="55" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">1.0</text>
    <text x="10" y="108" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">0.5</text>
    <text x="10" y="163" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">0.0</text>
    <text x="25" y="176" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">$80</text>
    <text x="135" y="176" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">$100</text>
    <text x="245" y="176" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">$120</text>
  </g>

  <!-- Plot 2: Gamma Bell Curve -->
  <g transform="translate(500, 125)">
    <rect x="0" y="0" width="280" height="195" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="14" y="22" fill="#f0f6fc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Gamma Curvature (Γ vs. Spot Price)</text>
    <line x1="25" y1="50" x2="260" y2="50" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="25" y1="105" x2="260" y2="105" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="25" y1="160" x2="260" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Bell Curve Gamma -->
    <path d="M 25 158 C 85 158, 120 156, 142 55 C 165 156, 200 158, 260 158" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="142" cy="55" r="4" fill="#10b981"/>
    <text x="150" y="52" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">Peak Γ @ K=100</text>

    <text x="25" y="176" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">$80</text>
    <text x="135" y="176" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">$100</text>
    <text x="245" y="176" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="8">$120</text>
  </g>

  <!-- Bottom Panel: Sensitivities Formulary Bar -->
  <g transform="translate(205, 335)">
    <rect x="0" y="0" width="575" height="95" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="6"/>
    <text x="16" y="22" fill="#f0f6fc" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Analytical Black-Scholes Formulations</text>
    <text x="16" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Δ_call = N(d₁)</text>
    <text x="175" y="48" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Γ = N'(d₁) / (S₀ σ √T)</text>
    <text x="380" y="48" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11">Θ = -(S₀ N'(d₁) σ)/(2√T) - r K e⁻ʳᵀ N(d₂)</text>
    <text x="16" y="74" fill="#8b949e" font-family="'Inter', sans-serif" font-size="10">
      Simulates cross-maturity strike curvature with instantaneous analytical partial derivatives via SciPy distributions.
    </text>
  </g>
</svg>
