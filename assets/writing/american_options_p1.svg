<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p1Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <pattern id="dotP1" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#p1Bg)" rx="8"/>
  <rect width="800" height="450" fill="url(#dotP1)" rx="8"/>
  <rect width="800" height="450" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="8"/>

  <!-- Left: Article Info -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="130" height="26" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" rx="4"/>
    <text x="12" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Derivatives / Pt. 1</text>

    <text x="0" y="70" fill="#f8fafc" font-family="'Newsreader', Georgia, serif" font-size="30" font-weight="600" letter-spacing="-0.5">American Options,</text>
    <text x="0" y="105" fill="#38bdf8" font-family="'Newsreader', Georgia, serif" font-size="30" font-weight="600" letter-spacing="-0.5">Part 1: Portfolio Approach</text>

    <text x="0" y="155" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">Constructing replication portfolios, deriving</text>
    <text x="0" y="178" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">the optimal early exercise boundary, and</text>
    <text x="0" y="201" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">examining put-call parity violations.</text>

    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">HARSHA MATTA</text>
      <text x="0" y="18" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">Feb 18, 2025 • Published on Medium</text>
    </g>
  </g>

  <!-- Right: Early Exercise Boundary Diagram -->
  <g transform="translate(430, 85)">
    <rect x="0" y="0" width="310" height="280" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="8"/>
    
    <text x="20" y="32" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Early Exercise Boundary</text>
    <text x="20" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Free Boundary Problem S*(t)</text>

    <!-- Axes -->
    <line x1="30" y1="215" x2="285" y2="215" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <line x1="30" y1="215" x2="30" y2="70" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="280" y="232" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Time t</text>
    <text x="10" y="68" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Spot S</text>

    <!-- Strike K level -->
    <line x1="30" y1="120" x2="285" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="250" y="112" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">K</text>

    <!-- Stopping Region (Shaded below boundary) -->
    <path d="M 30 185 C 100 183, 190 170, 270 120 L 270 215 L 30 215 Z" fill="rgba(239,68,68,0.12)"/>
    <text x="90" y="202" fill="#ef4444" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Stopping Region (Exercise Now)</text>

    <!-- Continuation Region -->
    <text x="80" y="95" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Continuation Region (Hold)</text>

    <!-- Boundary Curve S*(t) -->
    <path d="M 30 185 C 100 183, 190 170, 270 120" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="270" cy="120" r="4" fill="#38bdf8"/>
    <text x="145" y="162" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">S*(t) Boundary</text>

    <!-- Expiration line T -->
    <line x1="270" y1="70" x2="270" y2="215" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="265" y="232" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">T</text>

    <!-- Formula Box -->
    <rect x="25" y="245" width="260" height="25" fill="#0d1117" rx="4"/>
    <text x="155" y="261" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">V(S,t) ≥ max(K − S, 0) ∀ t ∈ [0, T]</text>
  </g>
</svg>
