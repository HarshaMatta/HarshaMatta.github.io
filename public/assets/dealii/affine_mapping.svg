<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cellFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#64748b"/>
    </marker>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="380" fill="#121417" rx="8"/>
  <rect width="760" height="380" fill="url(#gridPattern)" rx="8"/>
  <rect width="760" height="380" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="8"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="760" height="42" fill="#17191d" rx="8"/>
  <line x1="0" y1="42" x2="760" y2="42" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="24" cy="21" r="4.5" fill="#ef4444" opacity="0.8"/>
  <circle cx="40" cy="21" r="4.5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="56" cy="21" r="4.5" fill="#10b981" opacity="0.8"/>
  <text x="80" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">dealii::MappingQ &lt;2, 2&gt; — Real-to-Unit Affine Inversion</text>
  <text x="630" y="25" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">upstream: #14728</text>

  <!-- Left: Reference Unit Cell K_hat -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Unit Reference Cell <tspan fill="#38bdf8" font-family="'JetBrains Mono', monospace">K&#770; = [0, 1]&#178;</tspan></text>
    <text x="0" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Normalized coordinates (&#958;&#8321;, &#958;&#8322;)</text>

    <!-- Axes -->
    <line x1="20" y1="180" x2="190" y2="180" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
    <line x1="20" y1="180" x2="20" y2="30" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
    <text x="185" y="198" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">&#958;&#8321;</text>
    <text x="8" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">&#958;&#8322;</text>

    <!-- Square [0,1]^2 -->
    <rect x="20" y="60" width="120" height="120" fill="url(#cellFill)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Interior reference grid -->
    <line x1="80" y1="60" x2="80" y2="180" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Nodes -->
    <circle cx="20" cy="180" r="4.5" fill="#38bdf8"/>
    <circle cx="140" cy="180" r="4.5" fill="#38bdf8"/>
    <circle cx="140" cy="60" r="4.5" fill="#38bdf8"/>
    <circle cx="20" cy="60" r="4.5" fill="#38bdf8"/>

    <text x="10" y="196" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">(0,0)</text>
    <text x="130" y="196" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">(1,0)</text>
    <text x="130" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">(1,1)</text>
    <text x="10" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">(0,1)</text>

    <!-- Target Evaluation Point -->
    <circle cx="85" cy="115" r="4" fill="#f59e0b"/>
    <text x="94" y="118" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&#958;*</text>
  </g>

  <!-- Center: Mapping Arrows & Formula -->
  <g transform="translate(275, 120)">
    <!-- Forward Mapping Arrow -->
    <path d="M 10 35 C 50 15, 80 15, 120 35" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="65" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">F_K(&#958;)</text>

    <!-- Inverse Mapping Arrow (The fix) -->
    <path d="M 120 75 C 80 95, 50 95, 10 75" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="65" y="112" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">F_K&#8315;&#185;(x) [Affine Invert]</text>

    <!-- Formula Box -->
    <rect x="-15" y="130" width="160" height="52" fill="#181b20" stroke="rgba(255,255,255,0.07)" stroke-width="1" rx="4"/>
    <text x="65" y="150" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">J_K = &#8706;x / &#8706;&#958;</text>
    <text x="65" y="168" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">&#958;&#7522;&#8330;&#185; = &#958;&#7522; - J&#8315;&#185;(F(&#958;) - x)</text>
  </g>

  <!-- Right: Physical Deformed Mesh Cell K -->
  <g transform="translate(470, 80)">
    <text x="0" y="0" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Physical Distorted Cell <tspan fill="#38bdf8" font-family="'JetBrains Mono', monospace">K &#8834; &#937;</tspan></text>
    <text x="0" y="18" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Global mesh coordinates (x&#8321;, x&#8322;)</text>

    <!-- Axes -->
    <line x1="10" y1="185" x2="210" y2="185" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
    <line x1="10" y1="185" x2="10" y2="30" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
    <text x="205" y="202" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">x&#8321;</text>
    <text x="-2" y="32" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">x&#8322;</text>

    <!-- Distorted Quadrilateral -->
    <polygon points="35,160 175,175 195,50 65,75" fill="url(#meshGrad)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Curvilinear internal coordinate lines -->
    <path d="M 105 167 C 112 135, 120 95, 130 62" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="M 50 118 C 90 115, 140 116, 185 112" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Vertices -->
    <circle cx="35" cy="160" r="4.5" fill="#38bdf8"/>
    <circle cx="175" cy="175" r="4.5" fill="#38bdf8"/>
    <circle cx="195" cy="50" r="4.5" fill="#38bdf8"/>
    <circle cx="65" cy="75" r="4.5" fill="#38bdf8"/>

    <text x="18" y="172" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">v&#8320;</text>
    <text x="182" y="185" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">v&#8321;</text>
    <text x="202" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">v&#8322;</text>
    <text x="50" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">v&#8323;</text>

    <!-- Mapped Physical Point x* -->
    <circle cx="118" cy="115" r="4.5" fill="#f59e0b"/>
    <text x="127" y="118" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">x*</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <g transform="translate(30, 325)">
    <rect x="0" y="0" width="700" height="38" fill="#17191d" stroke="rgba(255,255,255,0.05)" stroke-width="1" rx="4"/>
    <text x="16" y="23" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">
      <tspan font-weight="600" fill="#38bdf8">Numerical Inversion:</tspan> Diagnosed and resolved coordinate mapping inaccuracies on distorted mesh cells to maintain Newton convergence in multi-threaded boundaries.
    </text>
  </g>
</svg>
