<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="optBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#optBg)" rx="8"/>
  <rect width="800" height="450" fill="url(#dotPattern)" rx="8"/>
  <rect width="800" height="450" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="8"/>

  <!-- Left: Article Information & Topic Badge -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="110" height="26" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" rx="4"/>
    <text x="12" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Pricing Theory</text>

    <text x="0" y="75" fill="#f8fafc" font-family="'Newsreader', Georgia, serif" font-size="34" font-weight="600" letter-spacing="-0.5">How do you</text>
    <text x="0" y="115" fill="#38bdf8" font-family="'Newsreader', Georgia, serif" font-size="34" font-weight="600" letter-spacing="-0.5">price an option?</text>

    <text x="0" y="165" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">The intuitive foundation of modern derivative</text>
    <text x="0" y="188" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">valuation: expected payoffs, risk-neutral</text>
    <text x="0" y="211" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">probabilities, and no-arbitrage mechanics.</text>

    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">HARSHA MATTA</text>
      <text x="0" y="18" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">Feb 14, 2025 • Published on Medium</text>
    </g>
  </g>

  <!-- Right: Risk-Neutral Valuation & Density Curve Visual -->
  <g transform="translate(430, 85)">
    <rect x="0" y="0" width="310" height="280" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="8"/>
    
    <!-- Header -->
    <text x="20" y="32" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Risk-Neutral Measure Q</text>
    <text x="20" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Eᵠ[e⁻ʳᵀ · (S_T − K)⁺]</text>

    <!-- Axes -->
    <line x1="25" y1="220" x2="285" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <line x1="25" y1="220" x2="25" y2="70" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

    <!-- Strike K line -->
    <line x1="150" y1="80" x2="150" y2="220" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="142" y="238" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">K (Strike)</text>

    <!-- Shaded ITM payoff area -->
    <path d="M 150 148 C 190 155, 230 190, 275 218 L 150 218 Z" fill="url(#bellGrad)"/>

    <!-- Log-Normal Density Curve under Q -->
    <path d="M 35 218 C 70 215, 100 110, 130 110 C 160 110, 200 170, 275 218" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- ITM Payload Tag -->
    <rect x="180" y="125" width="85" height="24" fill="#1f2937" stroke="rgba(56,189,248,0.4)" rx="4"/>
    <text x="190" y="141" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">ITM Payoff &gt; 0</text>

    <!-- Discounted Expectation Equation Box -->
    <rect x="25" y="245" width="260" height="25" fill="#0d1117" rx="4"/>
    <text x="155" y="261" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">V₀ = e⁻ʳᵀ ∫ (S_T − K) f_Q(S_T) dS_T</text>
  </g>
</svg>
