<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <pattern id="dotP2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#p2Bg)" rx="8"/>
  <rect width="800" height="450" fill="url(#dotP2)" rx="8"/>
  <rect width="800" height="450" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" rx="8"/>

  <!-- Left: Article Info -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="130" height="26" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" rx="4"/>
    <text x="12" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Derivatives / Pt. 2</text>

    <text x="0" y="70" fill="#f8fafc" font-family="'Newsreader', Georgia, serif" font-size="30" font-weight="600" letter-spacing="-0.5">American Options,</text>
    <text x="0" y="105" fill="#38bdf8" font-family="'Newsreader', Georgia, serif" font-size="30" font-weight="600" letter-spacing="-0.5">Part 2: Risk-Neutral</text>

    <text x="0" y="155" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">Discretizing continuous diffusion paths into</text>
    <text x="0" y="178" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">binomial lattice trees, backwards induction</text>
    <text x="0" y="201" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" font-weight="400">algorithms, and early exercise premiums.</text>

    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">HARSHA MATTA</text>
      <text x="0" y="18" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">Feb 24, 2025 • Published on Medium</text>
    </g>
  </g>

  <!-- Right: Binomial Lattice Tree Diagram -->
  <g transform="translate(430, 85)">
    <rect x="0" y="0" width="310" height="280" fill="#161b22" stroke="rgba(255,255,255,0.06)" rx="8"/>
    
    <text x="20" y="32" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Binomial Lattice Tree (CRR)</text>
    <text x="20" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic Backwards Induction</text>

    <!-- Lattice Tree Branches -->
    <!-- t=0 to t=1 -->
    <line x1="50" y1="140" x2="120" y2="100" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="50" y1="140" x2="120" y2="180" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- t=1 to t=2 -->
    <line x1="120" y1="100" x2="190" y2="70" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="100" x2="190" y2="140" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="180" x2="190" y2="140" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="120" y1="180" x2="190" y2="210" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- t=2 to t=3 -->
    <line x1="190" y1="70" x2="260" y2="45" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="190" y1="70" x2="260" y2="95" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="190" y1="140" x2="260" y2="95" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="190" y1="140" x2="260" y2="175" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="190" y1="210" x2="260" y2="175" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="190" y1="210" x2="260" y2="230" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Nodes (t=0) -->
    <circle cx="50" cy="140" r="5" fill="#38bdf8"/>
    <text x="35" y="160" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9">S₀</text>

    <!-- Nodes (t=1) -->
    <circle cx="120" cy="100" r="4.5" fill="#38bdf8"/>
    <circle cx="120" cy="180" r="4.5" fill="#38bdf8"/>

    <!-- Nodes (t=2) -->
    <circle cx="190" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="190" cy="140" r="4" fill="#f59e0b"/>
    <circle cx="190" cy="210" r="4" fill="#38bdf8"/>

    <!-- Nodes (t=3) -->
    <circle cx="260" cy="45" r="3.5" fill="#10b981"/>
    <circle cx="260" cy="95" r="3.5" fill="#10b981"/>
    <circle cx="260" cy="175" r="3.5" fill="#10b981"/>
    <circle cx="260" cy="230" r="3.5" fill="#ef4444"/>

    <!-- Backward arrow indicator -->
    <path d="M 230 190 L 140 190" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="185" y="185" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">← Backward Induction</text>

    <!-- Formula Box -->
    <rect x="25" y="245" width="260" height="25" fill="#0d1117" rx="4"/>
    <text x="155" y="261" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">V_i = max(Intrinsic, e⁻ʳᵟᵗ(qV_u + (1-q)V_d))</text>
  </g>
</svg>
